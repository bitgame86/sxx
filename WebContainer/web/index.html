                }
            }
            function onInputFocus() {
                lockPortrait();
                // Re-lock after keyboard fully opens

                setTimeout(lockPortrait, 600);
            }
            function attachInputListeners() {
                document.querySelectorAll('input, textarea').forEach(function (el) {
                    el.addEventListener('focus', onInputFocus);
                });

            if (document.readyState === 'loading') {

    <!-- Safari Crypto Fix MUST be before cocos scripts -->
    <script>
        // CRITICAL: Fix for iOS Safari crypto.randomUUID
        (function () {
            if (typeof window === 'undefined') return;

            // Create crypto if doesn't exist (very old Safari)
            if (!window.crypto) {
                window.crypto = {};
            }

            // Polyfill randomUUID for Safari < 15.2
            if (typeof window.crypto.randomUUID !== 'function') {

                window.crypto.randomUUID = function randomUUID() {
                    const hex = '0123456789abcdef';
                    let uuid = '';

                    for (let i = 0; i < 36; i++) {
                        if (i === 8 || i === 13 || i === 18 || i === 23) {
                            uuid += '-';
                        } else if (i === 14) {
                            uuid += '4'; // UUID version 4
                        } else if (i === 19) {
                            // UUID variant: bits 10xxxxxx
                            uuid += hex[(Math.random() * 4 | 8)];
                        } else {
                            uuid += hex[Math.floor(Math.random() * 16)];
                        }
                    }

                    return uuid;
                };
            }

            // Also ensure getRandomValues exists
            if (!window.crypto.getRandomValues && window.msCrypto) {
                window.crypto.getRandomValues = window.msCrypto.getRandomValues;
            }
        })();


    </script>
