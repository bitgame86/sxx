<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>SxxBet</title>

    <!--
      ⚠️ THẺ og:* DƯỚI ĐÂY LÀ TĨNH — GIỐNG NHAU CHO MỌI BỘ PHIM.

      G63 chốt 16/09 làm trang chia sẻ dạng tĩnh gọi API. Hệ quả phải biết trước, đừng báo là lỗi:

      Facebook, Zalo, Telegram, Viber KHÔNG chạy JavaScript khi bóc link. Chúng tải file này đúng
      một lần, đọc thẻ og:* có sẵn trong HTML, rồi thôi. Đoạn script bên dưới có đổi `document.title`
      hay chèn thẻ og mới thì CHỈ NGƯỜI DÙNG thấy — thẻ xem trước đã bị chốt từ lượt tải đầu.

      Nên link chia sẻ bộ nào cũng hiện cùng một ảnh và một dòng chữ ở dưới.

      Muốn thẻ đúng từng phim thì phải để SERVER dựng HTML. Endpoint đó vẫn còn nguyên, chưa xoá:
      GET /share-short/{code} trên GameServer (ShortDramaShareController.Share).
    -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SxxBet">
    <meta property="og:title" content="Phim ngắn SxxBet">
    <meta property="og:description" content="Xem phim ngắn miễn phí trên ứng dụng SxxBet.">

    <style>
        * { box-sizing: border-box }

        body {
            margin: 0;
            background: #0f1115;
            color: #e8eaed;
            font: 16px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 24px 16px;
            min-height: 100vh;
        }

        .card { width: 100%; max-width: 480px }

        .poster {
            border-radius: 14px;
            overflow: hidden;
            background: #1b1f27;
            margin-bottom: 18px;
            line-height: 0;
        }

        .poster img { width: 100%; height: auto; display: block }

        h1 { font-size: 22px; line-height: 1.3; margin: 0 0 10px }

        .meta { margin: 0 0 14px; display: flex; flex-wrap: wrap; gap: 8px }

        .chip {
            background: #1b1f27;
            border: 1px solid #2a2f3a;
            border-radius: 999px;
            padding: 3px 11px;
            font-size: 13px;
            color: #b9bfcc;
        }

        .chip-ep { background: #2b1d2f; border-color: #6d3b7a; color: #f0c8ff }

        .desc { margin: 0 0 22px; color: #b9bfcc; font-size: 15px; white-space: pre-wrap }

        .actions { display: flex; flex-direction: column; gap: 10px }

        .btn {
            display: block;
            text-align: center;
            text-decoration: none;
            border-radius: 12px;
            padding: 14px 18px;
            font-weight: 600;
            background: #1b1f27;
            border: 1px solid #2a2f3a;
            color: #e8eaed;
        }

        .btn-primary { background: #e0296d; border-color: #e0296d; color: #fff }

        .foot { margin: 28px 0 0; text-align: center; color: #6b7280; font-size: 13px }

        /* Khung chờ: giữ đúng chiều cao khối ảnh để lúc dữ liệu về không bị giật layout. */
        .skeleton { background: #1b1f27; border-radius: 14px }
        .sk-poster { aspect-ratio: 16/9; margin-bottom: 18px }
        .sk-line { height: 18px; margin-bottom: 10px }
        .sk-line.short { width: 55% }

        [hidden] { display: none !important }
    </style>
</head>

<body>
    <main class="card">
        <!-- Khung chờ, hiện ngay khi mở trang rồi bị thay khi API trả về. -->
        <div id="loading">
            <div class="skeleton sk-poster"></div>
            <div class="skeleton sk-line"></div>
            <div class="skeleton sk-line short"></div>
        </div>

        <div id="content" hidden>
            <div class="poster" id="posterBox" hidden><img id="poster" alt=""></div>
            <h1 id="title"></h1>
            <p class="meta" id="meta"></p>
            <p class="desc" id="desc" hidden></p>
            <div class="actions" id="actions"></div>
        </div>

        <div id="error" hidden>
            <h1 id="errTitle">Không tìm thấy phim</h1>
            <p class="desc">Link có thể đã hết hạn hoặc phim đã được gỡ.</p>
        </div>

        <p class="foot" id="foot">SxxBet</p>
    </main>

    <script>
        (function () {
            'use strict';

            /**
             * Host GameServer.
             *
             * ⚠️ Nằm lộ thiên trong mã nguồn trang — ai mở DevTools cũng đọc được. Đây là cái giá của
             * phương án trang tĩnh gọi API (G63 chốt 16/09), không phải sơ suất.
             */
            var API_BASE = 'https://node.thst86.org';

            var $ = function (id) { return document.getElementById(id); };

            /**
             * Lấy mã phim từ URL. Chấp nhận HAI dạng để không phụ thuộc vào cấu hình IIS:
             *
             *   /share-short/abc123?ep=2      ← dạng đẹp, cần luật rewrite trong web.config
             *   /share-short/?code=abc123&ep=2 ← chạy được khi CHƯA có luật rewrite
             *
             * Luật rewrite đá dạng đầu về `index.html?code=…`, nên thực tế `?code=` gần như luôn có.
             * Đọc cả đường dẫn là lưới đỡ để anh test được ngay khi chưa kịp cấu hình máy chủ.
             */
            function readParams() {
                var q = new URLSearchParams(location.search);
                var code = q.get('code') || '';

                if (!code) {
                    // Bỏ dấu / cuối rồi lấy đoạn cuối. Trang nằm ở /share-short/ nên đoạn cuối chính
                    // là mã — trừ khi đang mở thẳng index.html, lúc đó bỏ qua.
                    var parts = location.pathname.replace(/\/+$/, '').split('/');
                    var last = parts[parts.length - 1] || '';
                    if (last && last !== 'share-short' && last.indexOf('.') === -1) code = last;
                }

                var ep = parseInt(q.get('ep') || '0', 10);
                return { code: code, ep: ep > 0 ? ep : 0 };
            }

            function show(el) { el.hidden = false; }
            function hide(el) { el.hidden = true; }

            function fail(msg) {
                hide($('loading'));
                if (msg) $('errTitle').textContent = msg;
                show($('error'));
            }

            /** Tạo chip. `textContent` chứ không `innerHTML` — tên thể loại là dữ liệu, không phải mã. */
            function chip(text, cls) {
                var s = document.createElement('span');
                s.className = 'chip' + (cls ? ' ' + cls : '');
                s.textContent = text;
                return s;
            }

            function button(text, href, primary) {
                var a = document.createElement('a');
                a.className = 'btn' + (primary ? ' btn-primary' : '');
                a.href = href;
                a.rel = 'nofollow noopener';
                a.textContent = text;
                return a;
            }

            function render(d) {
                var epLabel = d.episodeNo > 0 ? ' - Tập ' + d.episodeNo : '';

                // Đổi title cho NGƯỜI DÙNG thấy đúng tên phim trên tab trình duyệt. Không ảnh hưởng gì
                // tới thẻ xem trước — Facebook đã đọc xong HTML từ trước khi dòng này chạy.
                document.title = d.title + epLabel + ' | ' + (d.siteName || 'SxxBet');

                if (d.image) {
                    $('poster').src = d.image;
                    $('poster').alt = d.title;
                    show($('posterBox'));
                }

                $('title').textContent = d.title;

                var meta = $('meta');
                if (d.episodeNo > 0) meta.appendChild(chip('Tập ' + d.episodeNo, 'chip-ep'));
                if (d.totalEpisodes > 0) meta.appendChild(chip('Trọn bộ ' + d.totalEpisodes + ' tập'));
                (d.tags || []).slice(0, 3).forEach(function (t) { meta.appendChild(chip(t)); });

                if (d.description) {
                    $('desc').textContent = d.description;
                    show($('desc'));
                }

                var actions = $('actions');
                if (d.androidUrl) actions.appendChild(button('Xem trên Android', d.androidUrl, true));
                if (d.iosUrl) actions.appendChild(button('Xem trên iOS', d.iosUrl, false));
                if (!d.androidUrl && !d.iosUrl) {
                    var p = document.createElement('p');
                    p.className = 'desc';
                    p.style.margin = '0';
                    p.textContent = 'Mở ứng dụng ' + (d.siteName || 'SxxBet') + ' để xem tập này.';
                    actions.appendChild(p);
                }

                if (d.siteName) $('foot').textContent = d.siteName;

                hide($('loading'));
                show($('content'));
            }

            var p = readParams();
            if (!p.code) {
                fail('Link không hợp lệ');
                return;
            }

            var url = API_BASE + '/api/short-drama/share/' + encodeURIComponent(p.code)
                + (p.ep > 0 ? '?ep=' + p.ep : '');

            fetch(url, { credentials: 'omit' })
                .then(function (r) {
                    // 404 cũng có thân JSON, nhưng nội dung không dùng được gì — coi như không tìm thấy.
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function (body) {
                    if (!body || !body.success || !body.data) throw new Error('payload rỗng');
                    render(body.data);
                })
                .catch(function (e) {
                    console.warn('[share-short] không lấy được dữ liệu:', e);
                    fail();
                });
        })();
    </script>
</body>

</html>
