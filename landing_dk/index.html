<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SXXBET | Link Tải App SXX BET Tặng Tiền Chính Thức 2026</title>
  <meta name="description"
    content="Tải SXX BET ngay hôm nay nhận code tân thủ cực khủng! Cập nhật link tải app SXX BET chính thức 2026 không bị chặn cho Android/iOS. Chơi game đổi thưởng uy tín.">
  <link rel="icon" href="assets/img/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <main class="page">
    <section class="hero">
      <div class="hero__bg"></div>

      <div class="hero__inner">

        <a class="logo" href="#" aria-label="SXXBET trang chủ">
          <img src="assets/img/logo.png" alt="SXXBET" width="284" height="108">
        </a>

        <h1 class="headline">
          <img src="assets/img/reg-header.png" alt="Đăng ký tài khoản – Tham gia trò chuyện cùng gái xinh">
        </h1>

        <!-- ẢNH TRÁI: cơ hội nhận 88K -->
        <div class="promo">
          <img src="assets/img/reg-hero-left.png" alt="Cơ hội nhận 88K khi đăng ký thành công" width="641" height="608">
        </div>

        <!-- THẺ TRUNG TÂM -->
        <div class="reg">

          <!-- BƯỚC 1: ĐĂNG KÝ -->
          <div class="reg__view" id="view-register">
            <form class="reg__form" id="register-form" novalidate>
              <div class="field">
                <img class="field__ic" src="assets/img/ic-user.png" alt="" width="22" height="23">
                <input type="text" id="reg-username" name="username" placeholder="Tên đăng nhập"
                  autocomplete="username" aria-label="Tên đăng nhập" required>
              </div>

              <div class="field">
                <img class="field__ic" src="assets/img/ic-lock.png" alt="" width="20" height="26">
                <input type="password" id="reg-password" name="password" placeholder="Mật khẩu"
                  autocomplete="new-password" aria-label="Mật khẩu" required>
                <button type="button" class="field__eye" data-target="reg-password" aria-label="Hiện mật khẩu">
                  <img src="assets/img/ic-eye.png" alt="" width="23" height="15">
                </button>
              </div>

              <div class="field">
                <img class="field__ic" src="assets/img/ic-lock.png" alt="" width="20" height="26">
                <input type="password" id="reg-password2" name="password2" placeholder="Nhập lại mật khẩu"
                  autocomplete="new-password" aria-label="Nhập lại mật khẩu" required>
                <button type="button" class="field__eye" data-target="reg-password2" aria-label="Hiện mật khẩu">
                  <img src="assets/img/ic-eye.png" alt="" width="23" height="15">
                </button>
              </div>

              <input type="hidden" id="reg-referral" name="referral">

              <!-- Captcha: chỉ hiện khi máy chủ yêu cầu -->
              <div class="field field--captcha" id="captcha-row" hidden>
                <input type="text" id="reg-captcha" name="captcha" placeholder="Nhập mã xác nhận"
                  autocomplete="off" maxlength="6" aria-label="Mã xác nhận">
                <img id="captcha-image" class="captcha-image" alt="Mã xác nhận" title="Bấm để đổi mã khác">
                <button type="button" id="captcha-reload" class="captcha-reload" title="Tải lại mã xác nhận"
                  aria-label="Tải lại mã xác nhận">↻</button>
              </div>

              <p class="reg__msg" id="register-error" hidden></p>

              <button type="submit" class="reg__submit" id="register-submit" aria-label="Đăng ký ngay"></button>

              <a href="#" class="reg__applink" id="to-download">Tải app ngay</a>
            </form>
          </div>

          <!-- BƯỚC 2: ĐĂNG KÝ THÀNH CÔNG / TẢI APP -->
          <div class="reg__view is-hidden" id="view-success">
            <h2 class="reg__done">Đăng ký thành công!</h2>
            <a class="reg__btn reg__btn--web" id="btn-play-web" href="#" aria-label="Chơi bản web"></a>
            <a class="reg__btn reg__btn--app" id="btn-install" href="#" aria-label="Tải app ngay"></a>
            <a href="#" class="reg__applink" id="to-register">Đăng ký ngay</a>
            <p class="reg__note">
              <b>SXXBET.FUN</b> khuyến nghị người dùng bật <b>1.1.1.1</b>
              để đảm bảo trải nghiệm truy cập ổn định với một số nhà mạng
            </p>
          </div>

        </div>

        <!-- CỘT PHẢI: 4 danh mục -->
        <div class="cats">
          <img src="assets/img/cat-casino.png" alt="Casino Nude Live" width="373" height="108">
          <img src="assets/img/cat-sport.png" alt="Sport Bet" width="373" height="108">
          <img src="assets/img/cat-idol.png" alt="Idol Live" width="373" height="108">
          <img src="assets/img/cat-fish.png" alt="Săn Cá" width="373" height="112">
        </div>

        <!-- HÀNG DƯỚI: chứng nhận / thanh toán / đối tác -->
        <div class="plates">
          <div class="plate"><img src="assets/img/plate-license.png" alt="Chứng nhận & giấy phép" width="531" height="165"></div>
          <div class="plate"><img src="assets/img/plate-payment.png" alt="Phương thức thanh toán" width="581" height="165"></div>
          <div class="plate"><img src="assets/img/plate-partner.png" alt="Đối tác chính thức" width="581" height="165"></div>
        </div>

      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>

</html>
